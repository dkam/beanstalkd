---
name: Continuous integration
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  tests:
    name: Tests on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
        matrix:
          runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: make check
  build:
    permissions:
      packages: write
      contents: read
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - tests
    steps:
      - name: Set up Docker Buildx with QEMU
        uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: actions/checkout@v4
      - name: Convert relevant environment variables
        id: convert
        run: |
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REF_NAME="${{ github.ref_name }}"
          TAG_VERSION=$(echo "$REF_NAME" | sed 's/^v//')
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "HAS_VERSION_TAG=${{ startsWith(github.ref, 'refs/tags/v') }}" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:latest
            ${{ env.HAS_VERSION_TAG == 'true' && format('ghcr.io/{0}:{1}', env.REPO, env.TAG_VERSION) || '' }}
